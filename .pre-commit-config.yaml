repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: prettier-check
        name: prettier --check (check semantics, no --write)
        entry: bunx prettier --check --ignore-unknown
        language: system
        types: [text]
      - id: eslint-tools
        name: eslint tools
        entry: bunx eslint tools --max-warnings=0
        language: system
        files: \.mjs$
      - id: cspell
        name: cspell lint
        entry: bunx cspell lint --no-progress --no-summary --config cspell.yaml
        language: system
        types: [text]
        files: \.md$
