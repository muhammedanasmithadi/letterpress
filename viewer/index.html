<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>letterpress</title>
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body>

<!--
  Phase 3 is the shell. The editor is a textarea and the preview is a
  placeholder, on purpose: the layout and the controls are judged on their own
  here, with no half-wired CodeMirror or PDF.js in the way to distract from
  either. app.js talks to the same render() the CLI uses, so what the preview
  reports and what Download writes cannot diverge.

  Every control below is a native element. That is not a shortcut. A styled
  <select> is broken in Firefox, which has no appearance: base-select, and
  hand-drawn toolbars lose keyboard behaviour and screen-reader labels that the
  platform gives for nothing. Theming lives in theme.css and is two lines.
-->

<header class="toolbar">
  <h1>letterpress</h1>

  <div class="group">
    <label class="field">
      <span>File</span>
      <input type="file" id="file" accept=".html,.htm,.xhtml,.svg,text/html">
    </label>
  </div>

  <div class="group" role="group" aria-label="Print settings">
    <label class="field">
      <span>Format</span>
      <select id="format">
        <!--
          The first option is not "a4". It is "whatever the document declares",
          because a document's own @page size wins over every flag here, and
          pretending otherwise is how a user ends up debugging the tool for a
          document that is correct.
        -->
        <option value="">document's own @page</option>
        <option value="a3">A3</option>
        <option value="a4">A4</option>
        <option value="a5">A5</option>
        <option value="legal">Legal</option>
        <option value="letter">Letter</option>
        <option value="tabloid">Tabloid</option>
      </select>
    </label>

    <label class="field checkbox">
      <input type="checkbox" id="landscape">
      <span>Landscape</span>
    </label>

    <label class="field">
      <span>Margin</span>
      <!-- type=text, not number: a CSS length like 15mm is not a number, and
           type=number rejects it outright. -->
      <input type="text" id="margin" placeholder="15mm" size="6" spellcheck="false"
             autocomplete="off" aria-disabled="true" readonly>
    </label>

    <label class="field checkbox">
      <input type="checkbox" id="background" checked>
      <span>Background</span>
    </label>

    <label class="field">
      <span>Max image PPI</span>
      <input type="number" id="ppi" value="300" min="0" step="10" size="5">
    </label>

    <label class="field checkbox">
      <input type="checkbox" id="network">
      <span>Allow network</span>
    </label>
  </div>

  <div class="spacer"></div>

  <div class="group">
    <button type="button" id="render" class="primary">Render</button>
    <button type="button" id="download" disabled>Download</button>
  </div>
</header>

<main class="split">
  <section class="pane" aria-labelledby="editor-label">
    <h2 id="editor-label">Source</h2>
    <!--
      aria-label, not aria-labelledby: the section's own heading names the
      region, not the field. Accessibility.getFullAXTree reported this control
      as textbox name="" while all eight others were correctly named.
    -->
    <textarea id="source" spellcheck="false" autocomplete="off" autocapitalize="off"
              aria-label="HTML source" aria-describedby="source-hint"><!doctype html>
<style>
  @page { size: A4; margin: 15mm }
  body { font: 11pt/1.5 sans-serif; color: #1a1a1a }
  h1 { font-size: 18pt; margin: 0 0 2mm }
</style>

<h1>Rendered by Chromium's own print engine</h1>
<p>Text stays selectable, the page count is real, and what you see is what
   the PDF contains. This is the actual PDF, not a live HTML preview, because
   print media emulation does not paginate.</p>
</textarea>
    <p id="source-hint" class="hint">
      Ctrl+Enter renders. Edits render after a short pause.
    </p>
  </section>

  <section class="pane" aria-labelledby="preview-label">
    <h2 id="preview-label">Preview</h2>
    <!--
      Outside #preview, not inside it. The preview is rebuilt with
      replaceChildren on every render, so a marker living in there was deleted by
      the first render — and the first render happens on load. Found because the
      element was in the served html and absent from the dom at the same moment.
    -->
    <p id="preview-note" class="stale" hidden></p>
    <div id="preview" class="preview">
      <p class="placeholder">
        Nothing rendered yet.
        <span class="sub">PDF.js draws the returned bytes here in the next phase.</span>
      </p>
    </div>
  </section>
</main>

<footer class="status">
  <!--
    aria-atomic so a change re-announces as a whole. The page count is also in
    the message app.js writes, not only in the metrics span beside it: the metrics
    were a sibling element, so the count was painted and never announced, and it
    is the one number a user wants.
  -->
  <output id="status" role="status" aria-live="polite" aria-atomic="true">Ready.</output>
  <span id="metrics" class="metrics"></span>
</footer>

<script type="module" src="/assets/app.js"></script>
</body>
</html>
