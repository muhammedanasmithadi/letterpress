name: publish

# Publishes to JSR when a version tag is pushed. Uses OIDC provenance,
# which is what JSR's "Has provenance" score checks for.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: bun install --frozen-lockfile

      - name: verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(jq -r .version package.json)
          JSR=$(jq -r .version jsr.json)
          echo "tag=$TAG pkg=$PKG jsr=$JSR"
          test "$TAG" = "$PKG" || { echo "tag/pkg mismatch"; exit 1; }
          test "$TAG" = "$JSR" || { echo "tag/jsr mismatch"; exit 1; }

      - name: run gates
        run: bun run check

      - name: publish to JSR
        run: deno publish
EOF
