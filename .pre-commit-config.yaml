repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
  - repo: local
    hooks:
      - id: oxfmt-check
        name: oxfmt --check (check semantics, no --write)
        entry: bunx oxfmt --check
        language: system
        types: [text]
        files: \.(ts|mts|cts|tsx|jsx|js|mjs|cjs|json|jsonc|md|markdown|html|htm|css)$
      - id: oxlint
        name: oxlint
        entry: bunx oxlint --max-warnings 0
        language: system
        files: \.(ts|mts|cts|tsx|jsx|js|mjs|cjs)$
        require_serial: true
      - id: cspell
        name: cspell lint
        entry: bunx cspell lint --no-progress --no-summary --config cspell.yaml
        language: system
        types: [text]
        require_serial: true
        files: \.md$
