name: test

# The suite runs a real browser and two independent PDF readers, so it is the only
# thing standing between a change and a silently broken renderer. It has until now
# only ever run on one machine, which is how a test reading its fixture from /tmp
# survived: it passed there and would have failed anywhere else.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run rather than queueing behind it.
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-python@v5
        with: { python-version-file: .python-version }
      - run: bun install --frozen-lockfile
      - run: pip install 'lizard==1.24.1'
      - run: bun run format:check
      - run: bun run lint
      - run: bun run spell
      - run: bun run ratchet
        env: { LIZARD_BIN: lizard }
      - run: bun run coverage
      - run: bunx commitlint --from HEAD~1 --to HEAD
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      # Chromium is not on the runner and cannot be apt-installed usefully: on Ubuntu
      # that package is a snap wrapper, which does not work in a container. This action
      # places a known build on PATH, which resolveChromium() finds by name.
      - name: install chromium
        uses: browser-actions/setup-chromium@v1
        with:
          chromium-version: 1406777

      # poppler and ghostscript are the independent readers. Every real defect this
      # project has found came from one of them or from veraPDF, never from this
      # repository's own tests, so a run without them proves much less than it looks
      # like it does.
      #
      # The fonts are not optional either. Several tests name a specific family --
      # DejaVu Sans for cap heights, Noto Naskh Arabic and Noto Kufi Arabic for the
      # fallback chain -- and a document's page count depends on the metrics of
      # whatever face it resolved to. The first CI run failed nine tests for exactly
      # this reason: not one of them was a product defect, and all nine were a font set
      # this repository depends on without declaring.
      - name: install the pdf readers and the fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils ghostscript \
            fonts-dejavu-core fonts-liberation2 fonts-noto-core

      # The headful parity test needs a display and skips without one. xvfb-run did not
      # give the test process a DISPLAY on the first attempt -- the run reported the
      # parity test skipped, which is the outcome this step exists to prevent -- so X
      # is started directly and the variable exported.
      - name: start a virtual display
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
          for _ in $(seq 1 20); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.5; done
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: record what the font set actually is
        run: |
          # Several tests resolve a family and depend on which face it lands on, so a
          # failure in one of them is uninterpretable without this. It is the first thing
          # to paste into an issue.
          echo "families: $(fc-list --format '%{family[0]}\n' | sort -u | wc -l)"
          for f in "DejaVu Sans" "DejaVu Sans:bold" "DejaVu Sans:italic" \
                   "DejaVu Serif" "Noto Naskh Arabic" "Noto Kufi Arabic" sans-serif serif; do
            echo "  fc-match '$f' -> $(fc-match "$f" --format '%{family}|%{style}|%{file}\n')"
          done

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck

      - name: test
        run: bun test

      # A rendered sample, so the run proves the whole path works rather than only that
      # assertions pass: a browser that fails to launch fails every render test anyway,
      # but this also catches a CLI that cannot write a file. The output path is
      # --out; a second positional argument is a usage error, which is how this step
      # first got written wrong.
      - name: render from the cli
        run: |
          printf '<!doctype html><meta charset="utf-8"><title>ci</title><h1>Hello</h1><p>one two three</p>' > /tmp/ci.html
          bun run render --out /tmp/ci.pdf /tmp/ci.html
          test -s /tmp/ci.pdf
          head -c 5 /tmp/ci.pdf | grep -q '%PDF-'
          pdftotext /tmp/ci.pdf - | grep -q 'Hello'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rendered-pdf-on-failure
          path: /tmp/ci.pdf
          if-no-files-found: ignore
