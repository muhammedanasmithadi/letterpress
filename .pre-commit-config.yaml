repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: oxfmt-check
        name: oxfmt --check (check semantics, no --write)
        entry: bunx oxfmt --check
        language: system
        files: \.(ts|mts|cts|tsx|jsx|js|mjs|cjs|json|jsonc|md|markdown|html|htm|css)$
      - id: oxlint
        name: oxlint
        entry: bunx oxlint --max-warnings 0
        language: system
        files: \.(ts|mts|cts|tsx|jsx|js|mjs|cjs)$
      - id: cspell
        name: cspell lint
        entry: bunx cspell lint --no-progress --no-summary --config cspell.yaml
        language: system
        types: [text]
        files: \.md$
