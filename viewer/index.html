<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>letterpress</title>
    <link rel="stylesheet" href="/assets/theme.css" />
  </head>
  <body>
    <!--
  Phase 3 is the shell. The editor is a textarea and the preview is a
  placeholder, on purpose: the layout and the controls are judged on their own
  here, with no half-wired CodeMirror or PDF.js in the way to distract from
  either. app.js talks to the same render() the CLI uses, so what the preview
  reports and what Download writes cannot diverge.

  Every control below is a native element. That is not a shortcut. A styled
  <select> is broken in Firefox, which has no appearance: base-select, and
  hand-drawn toolbars lose keyboard behaviour and screen-reader labels that the
  platform gives for nothing. Theming lives in theme.css and is two lines.
-->

    <header class="toolbar">
      <h1>letterpress</h1>

      <div class="group">
        <label class="field filefield">
          <span>File</span>
          <input type="file" id="file" accept=".html,.htm,.xhtml,.svg,text/html" />
        </label>
      </div>

      <div class="spacer"></div>

      <div class="group actions">
        <button type="button" id="render" class="primary">Render</button>
        <button type="button" id="download" title="Download the rendered PDF" disabled>PDF</button>
      </div>

      <!--
    Print settings ride a second toolbar row, always visible, no dropdown.
    Six small controls fit where eleven never did; the row wraps internally
    on narrow screens instead of stranding the actions.

    The row sits after the actions in the DOM, not before them. It used to be
    first and was moved into row two only by CSS `order`, which left the tab
    order running file -> settings -> Render -> PDF while the eye saw file,
    Render, PDF, then settings. A grid or flex `order` value reorders paint and
    not the focus sequence, so tab order follows the DOM here and matches what
    is on screen. The full-width basis is what still forces the wrap.
  -->
      <div class="settings-row" role="group" aria-label="Print settings">
        <label class="field">
          <span>Format</span>
          <select id="format">
            <!--
            The first option is not "a4". It is "whatever the document declares",
            because a document's own @page size wins over every flag here, and
            pretending otherwise is how a user ends up debugging the tool for a
            document that is correct.
          -->
            <option value="">document's own @page</option>
            <option value="a3">A3</option>
            <option value="a4">A4</option>
            <option value="a5">A5</option>
            <option value="legal">Legal</option>
            <option value="letter">Letter</option>
            <option value="tabloid">Tabloid</option>
          </select>
        </label>

        <label class="field">
          <span>Margin</span>
          <!-- type=text, not number: a CSS length like 15mm is not a number, and
             type=number rejects it outright. -->
          <input
            type="text"
            id="margin"
            placeholder="15mm"
            size="6"
            spellcheck="false"
            autocomplete="off"
            aria-disabled="true"
            readonly
          />
        </label>

        <label class="field">
          <span>Max image PPI</span>
          <input type="number" id="ppi" value="300" min="0" max="1200" step="10" size="5" />
        </label>

        <!-- Orientation as a segmented toggle: two buttons, pressed one bold
             (plus aria-pressed itself, so state never rides on color alone).
             #landscape is the Landscape button; app.js keeps a boolean for the
             payload instead of reading .checked. -->
        <div class="segmented underline" role="group" aria-label="Orientation">
          <button type="button" id="portrait" aria-pressed="true">Portrait</button>
          <button type="button" id="landscape" aria-pressed="false">Landscape</button>
        </div>

        <label class="field checkbox">
          <input type="checkbox" id="background" checked />
          <span>Background</span>
        </label>

        <label class="field checkbox">
          <input type="checkbox" id="network" />
          <span>Allow network</span>
        </label>
      </div>
    </header>

    <main class="split">
      <section class="pane" aria-labelledby="editor-label">
        <h2 id="editor-label">
          Source <span class="panemeta" id="source-meta" aria-hidden="true">HTML</span>
        </h2>
        <!--
      The editor is a grid-stack overlay, not a plain field: a highlighted <pre>
      and the textarea share one cell, so they scroll as one. The <pre> is paint
      only -- aria-hidden, no focus, no pointer events -- and the textarea keeps
      every native behavior (IME, undo, screen-reader announcements). Both layers
      read every metric from the same --ed-* variables; a metric set in two
      places drifts by a pixel per line and compounds.
      aria-label, not aria-labelledby, on the textarea: the section's own heading
      names the region, not the field. Accessibility.getFullAXTree reported this
      control as textbox name="" while all eight others were correctly named.
    -->
        <div class="editor" id="editor">
          <div class="gutter" id="gutter" aria-hidden="true"></div>
          <div class="codewrap" id="codewrap">
            <pre id="highlight" aria-hidden="true"></pre>
            <textarea
              id="source"
              spellcheck="false"
              autocomplete="off"
              autocapitalize="off"
              aria-label="HTML source"
            >
<!doctype html>
<style>
  @page { size: A4; margin: 15mm }
  body { font: 11pt/1.65 Georgia, serif; color: #1a1a1a }
  h1 { font-size: 28pt; line-height: 1.1; margin: 0 0 4mm }
</style>

<h1>Rendered by Chromium's own print engine</h1>
<p>Text stays selectable, the page count is real, and what you see is what
   the PDF contains. This is the actual PDF, not a live HTML preview, because
   print media emulation does not paginate.</p>
</textarea>
          </div>
        </div>
      </section>

      <section class="pane" aria-labelledby="preview-label">
        <h2 id="preview-label">Preview</h2>
        <!--
      Outside #preview, not inside it. The preview is rebuilt with
      replaceChildren on every render, so a marker living in there was deleted by
      the first render — and the first render happens on load. Found because the
      element was in the served html and absent from the dom at the same moment.
    -->
        <p id="preview-note" class="stale" hidden></p>
        <div id="preview" class="preview">
          <p class="placeholder">
            Nothing rendered yet.
            <span class="sub">The PDF draws here.</span>
          </p>
        </div>
      </section>
    </main>

    <footer class="status">
      <!--
    aria-atomic so a change re-announces as a whole. The page count is also in
    the message app.js writes, not only in the metrics span beside it: the metrics
    were a sibling element, so the count was painted and never announced, and it
    is the one number a user wants.
  -->
      <output id="status" role="status" aria-live="polite" aria-atomic="true"
        >Ready to render.</output
      >
      <!--
    The pager lives in the footer, not the preview pane: the preview container
    is rebuilt on every render, and the pane grid has no free track for a fifth
    child. It hides itself on single-page documents, where page controls are
    clutter. Fragment navigation only -- it never re-renders.
  -->
      <div class="pager" id="pager" hidden>
        <button type="button" id="page-prev" aria-label="Previous page">
          <span class="chev left" aria-hidden="true"></span>
        </button>
        <label class="pagelabel">
          <span class="visually-hidden">Page number</span>
          <input type="text" id="page-num" inputmode="numeric" size="3" value="1" />
          <span id="page-count" aria-hidden="true">of 1</span>
        </label>
        <button type="button" id="page-next" aria-label="Next page">
          <span class="chev right" aria-hidden="true"></span>
        </button>
      </div>
      <span id="metrics" class="metrics"></span>
    </footer>

    <script type="module" src="/assets/app.js"></script>
    <script type="module" src="/assets/webmcp.js"></script>
  </body>
</html>
